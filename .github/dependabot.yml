version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    # Um PR só para todas as actions, em vez de um por action
    groups:
      github-actions:
        patterns: ["*"]
  # pip: reativar na Fase 2, quando services/ingest ganhar pyproject.toml.
  # Antes disso o Dependabot aborta com "No files found in /services/ingest".
